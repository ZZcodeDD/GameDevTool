<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>日次清单看板</title>
  <style>
    :root {
      --ink: #1a2220;
      --muted: #5a6b65;
      --line: #d5ddd8;
      --head: #0f2a24;
      --head-fg: #f4f1ea;
      --row: #ffffff;
      --row-alt: #f3f7f4;
      --accent: #1f5c4d;
      --warn: #a14a16;
      --bg: #e8eee9;
      --shadow: 0 10px 30px rgba(15, 42, 36, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(800px 360px at 0% 0%, rgba(31, 92, 77, 0.12), transparent 60%),
        linear-gradient(180deg, #eef3f0, var(--bg));
      min-height: 100vh;
    }
    .wrap { max-width: 1400px; margin: 0 auto; padding: 20px 16px 48px; }
    header {
      display: flex; flex-wrap: wrap; gap: 12px;
      align-items: flex-end; justify-content: space-between;
      margin-bottom: 14px;
    }
    h1 {
      margin: 0;
      font-size: 1.8rem;
      letter-spacing: 0.06em;
      color: var(--head);
      font-weight: 700;
    }
    .sub { margin: 4px 0 0; color: var(--muted); font-size: 0.92rem; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    button, .file-btn {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 10px;
      padding: 8px 12px;
      cursor: pointer;
      font: inherit;
    }
    button.primary {
      background: var(--accent);
      color: #fff;
      border-color: transparent;
      font-weight: 650;
    }
    button:hover { filter: brightness(0.98); }
    .file-btn { display: inline-flex; align-items: center; }
    .file-btn input { display: none; }
    .rules {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px 14px;
      margin-bottom: 12px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255,255,255,0.85);
      box-shadow: var(--shadow);
    }
    .rules h2 {
      grid-column: 1 / -1;
      margin: 0 0 2px;
      font-size: 0.95rem;
      color: var(--head);
    }
    .rules label {
      display: grid;
      gap: 6px;
      font-size: 0.86rem;
      color: var(--muted);
    }
    .rules input, .rules select {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
      font: inherit;
      color: var(--ink);
      background: #fff;
    }
    .rules .note {
      grid-column: 1 / -1;
      margin: 0;
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.45;
    }
    .meta {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 0.86rem;
    }
    .table-scroller {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      box-shadow: var(--shadow);
    }
    table {
      border-collapse: separate;
      border-spacing: 0;
      width: max-content;
      min-width: 100%;
    }
    thead th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: var(--head);
      color: var(--head-fg);
      font-weight: 600;
      text-align: left;
      padding: 12px 10px;
      white-space: nowrap;
      border-right: 1px solid rgba(255,255,255,0.08);
    }
    tbody td {
      padding: 8px 10px;
      border-top: 1px solid var(--line);
      border-right: 1px solid #eef2ef;
      vertical-align: top;
      background: var(--row);
    }
    tbody tr:nth-child(even) td { background: var(--row-alt); }
    tbody tr.dragging td { background: #dff0e8; opacity: 0.92; }
    tbody tr.drag-over td { box-shadow: inset 0 2px 0 var(--accent); }
    .handle {
      cursor: grab;
      user-select: none;
      color: var(--muted);
      font-size: 1.1rem;
      padding: 4px 6px;
      display: inline-block;
    }
    .handle.disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .handle:active:not(.disabled) { cursor: grabbing; }
    .seq {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      color: var(--accent);
    }
    input[type="text"], input[type="date"], input[type="time"], select, textarea {
      width: 100%;
      min-width: 0;
      border: 1px solid transparent;
      background: transparent;
      border-radius: 8px;
      padding: 6px 8px;
      font: inherit;
      color: inherit;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: rgba(31, 92, 77, 0.45);
      background: #fff;
    }
    textarea { min-height: 56px; resize: vertical; }
    .title-input { min-width: 160px; font-weight: 650; }
    .sub-input { min-width: 140px; }
    .done-row td { opacity: 0.55; }
    .done-row .title-input { text-decoration: line-through; }
    .pri-高 { color: #a11f1f; font-weight: 700; }
    .pri-中 { color: var(--warn); font-weight: 650; }
    .pri-低 { color: var(--muted); }
    .hint {
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.55;
    }
    .toast {
      position: fixed; right: 16px; bottom: 16px;
      background: var(--head); color: #fff;
      padding: 10px 14px; border-radius: 10px;
      opacity: 0; transform: translateY(8px);
      transition: 0.25s ease; pointer-events: none;
      z-index: 9;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>日次清单</h1>
        <p class="sub">表头横向 · 记录纵向 · 规则在表上方统一设定</p>
      </div>
      <div class="actions">
        <button type="button" id="btnAdd">新增记录</button>
        <button type="button" id="btnReload">重新加载 JSON</button>
        <label class="file-btn">导入 JSON<input type="file" id="fileImport" accept="application/json,.json" /></label>
        <button type="button" id="btnExport" class="primary">导出 JSON</button>
      </div>
    </header>

    <section class="rules" aria-label="表格规则设定">
      <h2>表格规则设定</h2>
      <label>
        跨度超过（天）
        <input id="ruleSpan" type="number" min="0" step="1" placeholder="例如 7" />
      </label>
      <label>
        Cursor 复提醒间隔（天）
        <input id="ruleInterval" type="number" min="1" step="1" placeholder="例如 7" />
      </label>
      <label>
        表格排序
        <select id="ruleSort">
          <option value="seq">按序号顺序</option>
          <option value="priority">按优先级顺序</option>
        </select>
      </label>
      <p class="note">
        长周期规则：若「今天→完成日期」天数 ≥「跨度超过」，则按「Cursor 复提醒间隔」在对话里提醒。
        选「按序号」时可拖动 ⋮⋮ 调整先后；选「按优先级」时按 高→中→低 显示（拖动关闭）。
      </p>
    </section>

    <p class="meta" id="metaLine">尚未加载</p>
    <div class="table-scroller">
      <table>
        <thead>
          <tr>
            <th style="width:44px"></th>
            <th>序号</th>
            <th>优先级</th>
            <th>分类</th>
            <th>清单项目</th>
            <th>提醒日期</th>
            <th>提醒时间</th>
            <th>手机日历提醒</th>
            <th>完成</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <p class="hint">
      数据文件：同目录 <code>清单.json</code>。规则写在文件顶部的 <code>rules</code>；改完可导出覆盖仓库，或在 Cursor 对话里让我改。
    </p>
  </div>
  <div class="toast" id="toast"></div>
  <script>
    const STORAGE_KEY = "rici_board_v2";
    const PRI_RANK = { 高: 0, 中: 1, 低: 2 };
    const state = {
      updatedAt: "",
      rules: {
        spanThresholdDays: 7,
        cursorRemindIntervalDays: 7,
        sortMode: "seq",
      },
      items: [],
    };
    let dragId = null;

    const els = {
      tbody: document.getElementById("tbody"),
      meta: document.getElementById("metaLine"),
      toast: document.getElementById("toast"),
      fileImport: document.getElementById("fileImport"),
      ruleSpan: document.getElementById("ruleSpan"),
      ruleInterval: document.getElementById("ruleInterval"),
      ruleSort: document.getElementById("ruleSort"),
    };

    document.getElementById("btnAdd").onclick = () => {
      state.items.push(blankItem());
      renumberKeepOrder();
      persist();
      render();
      toast("已新增一行");
    };
    document.getElementById("btnReload").onclick = () => loadInitial(true);
    document.getElementById("btnExport").onclick = exportJson;
    els.fileImport.onchange = importJson;

    els.ruleSpan.addEventListener("change", onRulesChange);
    els.ruleInterval.addEventListener("change", onRulesChange);
    els.ruleSort.addEventListener("change", onRulesChange);

    loadInitial(false);

    function onRulesChange() {
      state.rules.spanThresholdDays = toNullNumber(els.ruleSpan.value);
      state.rules.cursorRemindIntervalDays = toNullNumber(els.ruleInterval.value);
      state.rules.sortMode = els.ruleSort.value === "priority" ? "priority" : "seq";
      persist();
      render();
      toast(state.rules.sortMode === "priority" ? "已按优先级排序显示" : "已按序号排序显示");
    }

    function syncRulesToForm() {
      els.ruleSpan.value = state.rules.spanThresholdDays ?? "";
      els.ruleInterval.value = state.rules.cursorRemindIntervalDays ?? "";
      els.ruleSort.value = state.rules.sortMode === "priority" ? "priority" : "seq";
    }

    async function loadInitial(forceNetwork) {
      try {
        if (!forceNetwork) {
          const local = localStorage.getItem(STORAGE_KEY);
          if (local) applyPayload(JSON.parse(local), "本机缓存");
        }
        const res = await fetch("./清单.json?t=" + Date.now(), { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        applyPayload(await res.json(), "清单.json");
        toast("已加载 清单.json");
      } catch (err) {
        if (!state.items.length) {
          applyPayload({
            updatedAt: nowIso(),
            rules: state.rules,
            items: [],
          }, "空清单（未能读取 JSON，可导入或新增）");
        }
        toast("读取 JSON 失败，可先导入文件：" + err.message);
      }
    }

    function applyPayload(data, source) {
      state.updatedAt = data.updatedAt || nowIso();
      state.rules = normalizeRules(data.rules);
      state.items = Array.isArray(data.items) ? data.items.map(normalize) : [];
      // 兼容旧字段：若条目上还有跨度字段则忽略
      renumberKeepOrder();
      syncRulesToForm();
      persist();
      render();
      els.meta.textContent = `来源：${source} · 更新 ${state.updatedAt} · 共 ${state.items.length} 条`;
    }

    function normalizeRules(raw) {
      const r = raw || {};
      return {
        spanThresholdDays: toNullNumber(r.spanThresholdDays ?? 7),
        cursorRemindIntervalDays: toNullNumber(r.cursorRemindIntervalDays ?? 7),
        sortMode: r.sortMode === "priority" ? "priority" : "seq",
      };
    }

    function normalize(raw, index) {
      const item = {
        id: raw.id || uid(),
        seq: Number.isFinite(raw.seq) ? raw.seq : index + 1,
        category: raw.category || "未分类",
        title: raw.title || "",
        priority: ["高", "中", "低"].includes(raw.priority) ? raw.priority : "中",
        remindDate: raw.remindDate || "",
        remindTime: raw.remindTime || "",
        phoneCalendar: raw.phoneCalendar === true,
        done: Boolean(raw.done),
        notes: raw.notes || "",
        createdAt: raw.createdAt || nowIso(),
      };
      if (raw.parentId) item.parentId = raw.parentId;
      return item;
    }

    function blankItem() {
      return normalize({
        category: "未分类",
        title: "新项目",
        priority: "中",
        phoneCalendar: false,
      }, state.items.length);
    }

    function renumberKeepOrder() {
      // 按当前数组顺序重写序号（拖拽后调用）
      state.items.forEach((item, i) => { item.seq = i + 1; });
    }

    function orderedForView() {
      const items = state.items.slice();
      if (state.rules.sortMode === "priority") {
        items.sort((a, b) => {
          if (a.done !== b.done) return a.done ? 1 : -1;
          const pa = PRI_RANK[a.priority] ?? 9;
          const pb = PRI_RANK[b.priority] ?? 9;
          if (pa !== pb) return pa - pb;
          return (a.seq || 0) - (b.seq || 0);
        });
      } else {
        items.sort((a, b) => (a.seq || 0) - (b.seq || 0));
      }
      return items;
    }

    function persist() {
      state.updatedAt = nowIso();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(toPayload()));
      els.meta.textContent = `已保存到本机 · 更新 ${state.updatedAt} · 共 ${state.items.length} 条 · 排序：${state.rules.sortMode === "priority" ? "优先级" : "序号"} · 记得导出 JSON 同步到仓库`;
    }

    function toPayload() {
      const bySeq = state.items.slice().sort((a, b) => (a.seq || 0) - (b.seq || 0));
      return {
        updatedAt: state.updatedAt,
        timezone: "Asia/Shanghai",
        rules: {
          spanThresholdDays: state.rules.spanThresholdDays,
          cursorRemindIntervalDays: state.rules.cursorRemindIntervalDays,
          sortMode: state.rules.sortMode,
        },
        items: bySeq.map(({ seq, ...rest }) => {
          const out = { ...rest };
          if (!out.parentId) delete out.parentId;
          return out;
        }),
      };
    }

    function toNullNumber(v) {
      if (v === "" || v === null || v === undefined) return null;
      const n = Number(v);
      return Number.isFinite(n) ? n : null;
    }

    function render() {
      const canDrag = state.rules.sortMode === "seq";
      const viewItems = orderedForView();
      els.tbody.innerHTML = "";

      viewItems.forEach((item) => {
        const tr = document.createElement("tr");
        tr.dataset.id = item.id;
        if (item.done) tr.classList.add("done-row");

        tr.innerHTML = `
          <td><span class="handle ${canDrag ? "" : "disabled"}" title="${canDrag ? "拖动排序" : "优先级排序下不可拖动"}" ${canDrag ? 'draggable="true"' : ""}>⋮⋮</span></td>
          <td class="seq">${item.seq}</td>
          <td>
            <select data-k="priority" class="pri-${item.priority}">
              <option value="高" ${item.priority === "高" ? "selected" : ""}>高</option>
              <option value="中" ${item.priority === "中" ? "selected" : ""}>中</option>
              <option value="低" ${item.priority === "低" ? "selected" : ""}>低</option>
            </select>
          </td>
          <td><input data-k="category" type="text" value="${escAttr(item.category)}" style="min-width:88px;font-weight:650" /></td>
          <td><input class="title-input" data-k="title" type="text" value="${escAttr(item.title)}" /></td>
          <td><input data-k="remindDate" type="date" value="${escAttr(item.remindDate)}" /></td>
          <td><input data-k="remindTime" type="time" value="${escAttr(item.remindTime)}" /></td>
          <td style="text-align:center"><input data-k="phoneCalendar" type="checkbox" ${item.phoneCalendar ? "checked" : ""} /></td>
          <td style="text-align:center"><input data-k="done" type="checkbox" ${item.done ? "checked" : ""} /></td>
          <td><button type="button" data-del>删除</button></td>
        `;

        tr.querySelectorAll("[data-k]").forEach((el) => {
          const ev = el.type === "checkbox" || el.tagName === "SELECT" ? "change" : "input";
          el.addEventListener(ev, () => {
            const key = el.dataset.k;
            if (el.type === "checkbox") {
              item[key] = el.checked;
            } else {
              item[key] = el.value;
            }
            if (key === "priority") {
              el.className = "pri-" + item.priority;
              if (state.rules.sortMode === "priority") {
                persist();
                render();
                return;
              }
            }
            if (key === "done") tr.classList.toggle("done-row", item.done);
            persist();
          });
        });

        tr.querySelector("[data-del]").onclick = () => {
          if (!confirm("删除这条记录？")) return;
          state.items = state.items.filter((x) => x.id !== item.id);
          // 按原序号顺序重排
          state.items.sort((a, b) => (a.seq || 0) - (b.seq || 0));
          renumberKeepOrder();
          persist();
          render();
        };

        const handle = tr.querySelector(".handle");
        if (canDrag) {
          handle.addEventListener("dragstart", (e) => {
            dragId = item.id;
            tr.classList.add("dragging");
            e.dataTransfer.effectAllowed = "move";
            e.dataTransfer.setData("text/plain", item.id);
          });
          handle.addEventListener("dragend", () => {
            dragId = null;
            tr.classList.remove("dragging");
            els.tbody.querySelectorAll("tr").forEach((r) => r.classList.remove("drag-over"));
          });
          tr.addEventListener("dragover", (e) => {
            e.preventDefault();
            tr.classList.add("drag-over");
          });
          tr.addEventListener("dragleave", () => tr.classList.remove("drag-over"));
          tr.addEventListener("drop", (e) => {
            e.preventDefault();
            tr.classList.remove("drag-over");
            const fromId = dragId || e.dataTransfer.getData("text/plain");
            const toId = item.id;
            if (!fromId || fromId === toId) return;
            state.items.sort((a, b) => (a.seq || 0) - (b.seq || 0));
            const from = state.items.findIndex((x) => x.id === fromId);
            const to = state.items.findIndex((x) => x.id === toId);
            if (from < 0 || to < 0) return;
            const [moved] = state.items.splice(from, 1);
            state.items.splice(to, 0, moved);
            renumberKeepOrder();
            persist();
            render();
            toast("已按位置更新序号");
          });
        }

        els.tbody.appendChild(tr);
      });
    }

    function exportJson() {
      const payload = toPayload();
      const blob = new Blob([JSON.stringify(payload, null, 2) + "\n"], { type: "application/json;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "清单.json";
      a.click();
      URL.revokeObjectURL(a.href);
      toast("已导出 清单.json");
    }

    function importJson(ev) {
      const file = ev.target.files && ev.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          applyPayload(JSON.parse(String(reader.result)), file.name);
          toast("导入成功");
        } catch (err) {
          toast("导入失败：" + err.message);
        }
      };
      reader.readAsText(file, "utf-8");
      ev.target.value = "";
    }

    function toast(msg) {
      els.toast.textContent = msg;
      els.toast.classList.add("show");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => els.toast.classList.remove("show"), 2200);
    }

    function nowIso() {
      const d = new Date();
      const pad = (n) => String(n).padStart(2, "0");
      const off = -d.getTimezoneOffset();
      const sign = off >= 0 ? "+" : "-";
      const oh = pad(Math.floor(Math.abs(off) / 60));
      const om = pad(Math.abs(off) % 60);
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}${sign}${oh}:${om}`;
    }

    function uid() {
      return "p_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 7);
    }

    function escAttr(v) {
      return String(v ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll('"', "&quot;")
        .replaceAll("<", "&lt;");
    }

    function escText(v) {
      return String(v ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;");
    }
  </script>
</body>
</html>
